<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Earth</title>

    <link rel="stylesheet" href="contactstyle.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>🌍 Earth</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="index.html#about">About Earth</a>
            <a href="index.html#facts">Facts</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <!-- Main Content -->
    <main>

        <section id="contact">

            <h2>Contact Us</h2>

            <p>
                Have a question or want to share your thoughts about Earth?
                Feel free to contact us.
            </p>


            <!-- Contact Form -->
            <form>

                <label for="name">Name:</label>
                <br>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <br><br>


                <label for="email">Email:</label>
                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <br><br>


                <label for="subject">Subject:</label>
                <br>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                >

                <br><br>


                <label for="message">Message:</label>
                <br>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>

                <br><br>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>© 2026 Earth Website</p>

        <p>Let's protect our planet 🌍</p>

    </footer>

</body>

</html>
